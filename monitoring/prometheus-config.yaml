apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: otel-lab
data:
  prometheus.yaml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      external_labels:
        cluster:     otel-lab-chaos
        environment: production

    rule_files:
      - /etc/prometheus/rules.yaml

    scrape_configs:
      # OTel Collector — métricas de los microservicios
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector-svc:8889"]

      # Métricas internas del Collector
      - job_name: otel-collector-internal
        static_configs:
          - targets: ["otel-collector-svc:8888"]

      # Scraping de pods con anotaciones prometheus.io/scrape
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [otel-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}

      # LitmusChaos metrics
      - job_name: litmus-chaos-operator
        static_configs:
          - targets: ["chaos-operator-metrics.litmus:8080"]

      # Chaos Mesh metrics
      - job_name: chaos-mesh-controller
        static_configs:
          - targets: ["chaos-controller-manager-metrics.chaos-mesh:10080"]

  rules.yaml: |
    groups:
      - name: sli.recording
        interval: 15s
        rules:
          # SLI de errores por servicio (semconv HTTP estable)
          - record: svc:error_ratio:rate1m
            expr: |
              sum by (exported_job) (rate(otelcol_http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1m]))
              / sum by (exported_job) (rate(otelcol_http_server_request_duration_seconds_count[1m]))
          # SLI de latencia p99 por servicio
          - record: svc:latency_p99:1m
            expr: |
              histogram_quantile(0.99, sum by (exported_job, le) (rate(otelcol_http_server_request_duration_seconds_bucket[1m])))
          # Baseline dinámico: media y desviación estándar de los últimos 30m
          - record: svc:error_ratio:baseline_avg30m
            expr: avg_over_time(svc:error_ratio:rate1m[30m])
          - record: svc:error_ratio:baseline_stddev30m
            expr: stddev_over_time(svc:error_ratio:rate1m[30m])

      - name: aiops.anomaly_detection
        interval: 15s
        rules:
          # AIOps — umbral DINÁMICO: error_rate > baseline + 2σ
          # (piso de 1% para no alertar por ruido cuando el baseline es ~0)
          - alert: ErrorRateAnomaly2Sigma
            expr: |
              svc:error_ratio:rate1m
                > (svc:error_ratio:baseline_avg30m + 2 * svc:error_ratio:baseline_stddev30m)
              and svc:error_ratio:rate1m > 0.01
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Error rate anómalo (>baseline+2σ) en {{ $labels.exported_job }}"
              description: "error_ratio={{ $value | humanizePercentage }}"
              runbook: "Buscar trazas con error=true en Jaeger para {{ $labels.exported_job }}"

          # SLO de latencia: p99 < 500ms (baseline medido ~400ms con db-f1-micro)
          - alert: LatencySLOBreach
            expr: svc:latency_p99:1m > 0.5
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "p99 > 500ms en {{ $labels.exported_job }}"
              description: "p99={{ $value }}s"

          # Regla de CORRELACIÓN del enunciado:
          # error_rate > baseline + 2σ  Y  latency_p99 > SLO_threshold
          - alert: AIOpsCorrelatedAnomaly
            expr: |
              (svc:error_ratio:rate1m
                > (svc:error_ratio:baseline_avg30m + 2 * svc:error_ratio:baseline_stddev30m)
               and svc:error_ratio:rate1m > 0.01)
              and on (exported_job) svc:latency_p99:1m > 0.5
            for: 30s
            labels:
              severity: critical
              page: "true"
            annotations:
              summary: "Anomalía correlacionada (errores + latencia) en {{ $labels.exported_job }}"

      - name: static.baseline_comparison
        interval: 15s
        rules:
          # Umbrales ESTÁTICOS clásicos — solo para comparar ruido vs. AIOps
          - alert: Static_AnyError
            expr: svc:error_ratio:rate1m > 0
            labels: {severity: info, kind: static}
          - alert: Static_LatencyP99_200ms
            expr: svc:latency_p99:1m > 0.2
            labels: {severity: info, kind: static}
